<style>

nav.main{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav.main a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}nav.main a.on,nav.main a:hover{background:var(--soft);color:var(--accent2)}

button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.sm{padding:4px 12px;margin:0;font-size:14px}button:disabled{opacity:.5}
button.gold{background:var(--gold);color:#1b1405}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs a{padding:7px 14px;border-radius:9px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;background:var(--card)}.tabs a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{max-width:640px;margin:8px auto;font-size:19px;opacity:.95}
.hero .btn{background:#fff;color:#0f4a38;margin:10px 5px 0}.hero .btn.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.hero .ayat{margin:22px auto 0;max-width:640px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 16px}
.hero .ayat .ayah{font-size:26px;line-height:2.2}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.feat b{display:block;font-size:18px;margin-bottom:4px;color:var(--accent2)}
.feat .ic{font-size:28px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.steps div{counter-increment:s;background:var(--soft);border-radius:14px;padding:14px 16px}.steps div::before{content:counter(s);display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-inline-end:8px}
.ayah{font-family:"Amiri Quran","Noto Naskh Arabic",serif;line-height:2.5;margin:0}
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.surahs a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink)}.surahs a:hover{border-color:var(--accent);background:var(--soft)}
.surahs .n{min-width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.surahs b{display:block;font-size:17px;line-height:1.3}.surahs span.c{font-size:12px;color:var(--mute)}
.mushaf{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow);text-align:start;text-align-last:center}
@supports (text-justify:inter-word){.mushaf:not(.lines){text-align:justify;text-justify:inter-word}}   /* WebKit has no inter-word justification and stretches Arabic inside words, so it keeps start alignment */
.mushaf .ayah{font-size:var(--fs,30px)}.mushaf .a{cursor:pointer;border-radius:8px;padding:0 2px}.mushaf .a:hover{background:var(--soft)}.mushaf .a.bm{background:rgba(184,138,46,.22)}.mushaf .a.hit{background:rgba(28,107,80,.22)}.mushaf .a.playing{background:rgba(184,138,46,.38);box-shadow:0 0 0 2px rgba(184,138,46,.55)}
.mushaf.lines .a{display:block;padding:4px 6px;border-bottom:1px dashed var(--line)}
.num{color:var(--goldtx);font-family:"Noto Naskh Arabic",serif;font-size:.7em;margin:0 3px}
.sname{text-align:center;border:2px solid var(--gold);border-radius:12px;padding:6px;margin:0 0 12px;font-size:26px;color:var(--accent2);font-weight:700}
.bsm{text-align:center;font-size:calc(var(--fs,30px) + 2px)}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:0 0 14px}.toolbar>div{min-width:120px;flex:1}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
footer{max-width:1100px;margin:0 auto;padding:10px 16px 40px;color:var(--mute);font-size:13px;text-align:center}
.cert{border:2px solid var(--gold);border-radius:14px;padding:12px 16px;margin:8px 0;background:var(--soft)}
@media (max-width:600px){body{font-size:16px}.hero{padding:30px 14px}nav.main a{font-size:14px;padding:5px 9px}}
.tj-ghunna{color:#2b9a6d;font-weight:700}.tj-ikhfa{color:#2f6fb0;font-weight:700}.tj-idg_g{color:#14a39a;font-weight:700}.tj-idg_n{color:#9a63d0;font-weight:700}.tj-iqlab{color:#d9822b;font-weight:700}.tj-qalqala{color:#d04a3a;font-weight:700}.tj-madd{color:#b8851f;font-weight:700}
@media(max-width:700px){.bar{gap:8px;padding:8px 12px}.brand{font-size:22px}.brand i{width:28px;height:28px}nav.main{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}nav.main::-webkit-scrollbar{display:none}nav.main a{white-space:nowrap;flex:0 0 auto}#who{margin-inline-start:auto}main{padding:12px 12px 48px}.hero{padding:30px 16px}.card{padding:14px}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs a{white-space:nowrap;flex:0 0 auto}}

<body>
<header class="top"><div class="bar"><a class="brand" href="#/"><i></i>ترتيل</a><nav class="main" id="nav"></nav><div id="who"></div></div></header>
<main id="app"></main>
<footer>منصة تعليمية. لا تُصدر المنصة فتاوى ولا إجازات ولا أحكامًا شرعية؛ التقييمات يكتبها مقرئ بشري. نص المصحف: رواية حفص عن عاصم من مشروع تنزيل (tanzil.net)، وهو قيد التدقيق العلمي النهائي.</footer>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v===undefined||v===null||v===false)continue;if(x==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(x==='class')e.className=v;else if(x==='value')e.value=v;else e.setAttribute(x,v===true?'':v)}for(const c of k.flat(2))e.append(c instanceof Node?c:document.createTextNode(c??''));return e};
let token=null;try{token=sessionStorage.getItem('t')}catch{}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const ERR={unauthenticated:'انتهت الجلسة، سجّل الدخول مجددًا',forbidden:'غير مسموح لك بهذا الإجراء',guardian_consent_required:'يلزم موافقة وليّ الأمر قبل التسجيل',already_exists:'موجود مسبقًا',invalid_credentials:'بيانات الدخول غير صحيحة',validation_failed:'بيانات غير صالحة، راجع الحقول',user_not_found:'لا يوجد حساب بهذا البريد — اطلب من الشخص أن يسجّل أولًا',not_found:'غير موجود',session_revoked:'أُنهيت هذه الجلسة، سجّل الدخول مجددًا',model_not_connected:'لم يُربط نموذج ذكاء اصطناعي بعد',model_failed:'تعذّر على النموذج الرد الآن، حاول لاحقًا',guardian_required:'يلزم وليّ أمر موثَّق قبل انضمام القاصر',session_not_open:'الجلسة غير مفتوحة الآن (تُفتح قبل الموعد بـ15 دقيقة)',track_not_complete:'لم يُكمل الطالب كل وحدات المسار',track_not_published:'المسار غير منشور',track_empty:'المسار بلا وحدات',rate_limited:'محاولات كثيرة، انتظر دقيقة',invalid_reference:'مرجع غير صالح (تأكد من اختيار الطالب/الحلقة)',edition_not_available:'نص القرآن غير متاح بعد',storage_not_configured:'تخزين الصوت غير مُعدّ',bad_request:'طلب غير صالح',service_unavailable:'الخدمة غير متاحة مؤقتًا، حاول بعد قليل'};
const BASE=(document.querySelector('meta[name=api-base]')||{}).content||'';
async function api(method,url,body){let r;try{r=await fetch(BASE+url,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined})}catch{throw Object.assign(new Error('تعذّر الاتصال بالخادم، تحقق من الشبكة'),{status:0})}
  let j={};try{j=await r.json()}catch{}
  if(!r.ok){const e=new Error(ERR[j.error]||j.error||('خطأ '+r.status));e.status=r.status;e.code=j.error;if(r.status===401&&token&&j.error!=='invalid_credentials'){setToken(null)}throw e}return j}
function setToken(t){token=t;try{t?sessionStorage.setItem('t',t):sessionStorage.removeItem('t')}catch{}if(!t)ME=null}
const note=(box,text,cls='')=>{box.replaceChildren(el('div',{class:'msg '+cls},text))};
const run=async(box,fn)=>{try{await fn()}catch(e){note(box,e.message,'err');if(e.status===401&&!token)setTimeout(route,300)}};
let fieldN=0;
const field=(l,i)=>{const id='f'+(++fieldN);if(i&&i.nodeType===1&&!i.id)i.id=id;return el('div',{},el('label',{for:i&&i.id||id},l),i)};
const table=(heads,rows)=>el('div',{style:'overflow-x:auto'},el('table',{},el('thead',{},el('tr',{},heads.map(h=>el('th',{},h)))),el('tbody',{},rows.map(r=>el('tr',{},r.map(c=>el('td',{},c)))))));
const fmt=d=>d?new Date(d).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'}):'—';
const ar=n=>Number(n).toLocaleString('ar-EG');
const empty=t=>el('div',{class:'empty'},t);
const ROLE={tenant_admin:'مدير المؤسسة',qari:'مقرئ',student:'طالب',guardian:'وليّ أمر',safeguarding_officer:'مسؤول حماية',scholarly_reviewer:'مراجع علمي'};
const SURAH=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];
const surahName=n=>'سورة '+(SURAH[n-1]||n);
const surahSelect=(val=1)=>el('select',{},SURAH.map((s,i)=>el('option',{value:i+1,...(i+1===val?{selected:true}:{})},ar(i+1)+'. '+s)));
const norm=t=>t.normalize('NFKD').replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[آأإٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');

/* ---------- Quran data ---------- */
let EDITION=null,REF=null;const SC=new Map();
async function quranMeta(){if(!EDITION){const e=await api('GET','/quran/editions');EDITION=e.editions[0]||false}if(!REF)REF=(await api('GET','/quran/reference')).surahs;return{ed:EDITION,ref:REF}}
async function surahData(n){const{ed}=await quranMeta();if(!ed)throw new Error('لا يوجد نص قرآني معتمد بعد');if(!SC.has(n)){for(let t=0;;t++){try{SC.set(n,await api('GET','/quran/'+encodeURIComponent(ed.code)+'/'+n));break}catch(e){if(e.code!=='rate_limited'||t>=6)throw e;await new Promise(r=>setTimeout(r,10000))}}}return SC.get(n)}
const bm=()=>new Set(store.get('bm',[]));
function toggleBm(s,a){const b=bm(),k=s+':'+a;b.has(k)?b.delete(k):b.add(k);store.set('bm',[...b]);return b.has(k)}

/* ---------- shell ---------- */
let ME=null;
function renderNav(active){
  const items=[['#/','الرئيسية','home'],['#/quran','القرآن الكريم','quran'],['#/search','بحث','search'],['#/tajweed','التجويد','tajweed'],['#/qiraat','القراءات','qiraat']];
  if(token)items.push(['#/me','رحلتي','me'],['#/app','لوحتي','app']);
  if(token&&isScholar())items.push(['#/review','المراجعة العلمية','review']);
  $('#nav').replaceChildren(...items.map(([h,t,k])=>el('a',{href:h,class:k===active?'on':''},t)));
  const who=$('#who');
  if(token&&ME)who.replaceChildren(ME.displayName,el('button',{class:'ghost sm',on:{click:()=>{setToken(null);location.hash='#/';route()}}},'خروج'));
  else if(token)who.replaceChildren();
  else who.replaceChildren(el('a',{class:'btn sm',href:'#/auth',style:'margin:0'},'دخول / تسجيل'));
}
async function route(){
  if(!/^#\/quran\/\d/.test(location.hash))stopAudio();
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),app=$('#app');
  window.scrollTo(0,0);
  if(token&&!ME){try{ME=await api('GET','/me')}catch{ME=null}}
  const top=parts[0]||'';
  try{
    if(top==='quran'){renderNav('quran');await quranRoute(app,parts)}
    else if(top==='search'){renderNav('search');await searchView(app,parts)}
    else if(top==='tajweed'){renderNav('tajweed');await tajweedView(app,parts)}
    else if(top==='qiraat'){renderNav('qiraat');qiraatView(app)}
    else if(top==='review'){renderNav('review');await reviewView(app,parts)}
    else if(top==='me'){renderNav('me');await meView(app,parts)}
    else if(top==='auth'){renderNav('');authView(app)}
    else if(top==='verify'){renderNav('');await verifyView(app,parts[1])}
    else if(top==='app'){renderNav('app');if(!token){location.hash='#/auth';return}await dashboard(app,parts)}
    else{renderNav('home');await landing(app)}
  }catch(e){app.replaceChildren(el('div',{class:'card'},el('div',{class:'msg err'},e.message)))}
}
window.addEventListener('hashchange',route);

/* ---------- landing ---------- */

      el('h3',{},'السجلّ'),x.history.length?table(['من','إلى','المراجع','الملاحظة','التاريخ'],x.history.map(h=>[STATE_AR[h.fromState],STATE_AR[h.toState],h.reviewer||'—',h.note||'—',fmt(h.createdAt)])):empty('لا انتقالات بعد.'),

/* ---------- tajweed colouring: a SEPARATE display layer over the stored text (the text itself is never altered) ---------- */
const TJC={ghunna:['غنّة مشددة (نّ، مّ)','#2b9a6d'],ikhfa:['إخفاء','#2f6fb0'],idg_g:['إدغام بغنة','#14a39a'],idg_n:['إدغام بغير غنة','#7b4bb0'],iqlab:['إقلاب','#d9822b'],qalqala:['قلقلة','#c0392b'],madd:['مد زائد على الطبيعي','#a8741a']};
function tajweedClusters(text){
  const L=/[ء-غف-يٱ]/,M=/[ً-ٰٟۖ-ۭـ]/,cl=[];
  for(const ch of text){if(L.test(ch))cl.push({t:ch,b:ch,m:'',w:false});else if(M.test(ch)&&cl.length&&!cl[cl.length-1].sep){const c=cl[cl.length-1];c.t+=ch;c.m+=ch}else cl.push({t:ch,b:'',m:'',sep:true})}
  return cl}
function tajweedClassify(text){
  const cl=tajweedClusters(text),has=(c,re)=>re.test(c.m),V=/[ًٌٍَُِّٰ]/,
    hamza=new Set('ءأإؤئ'),halqi=new Set('ءأإؤئهعحغخ'),ikhfaL=new Set('تثجدذزسشصضطظفقك'),idgG=new Set('ينمو'),idgN=new Set('لر'),QAL=new Set('قطبجد');
  const out=cl.map(()=>null);
  const nextLetter=(i)=>{let crossed=false;for(let j=i+1;j<cl.length;j++){const c=cl[j];if(c.sep){if(c.t===' ')crossed=true;continue}
      if(c.b==='ٱ'&&crossed){continue}
      if(/^[ۖ-ۜ]$/.test(c.m.trim()?c.m[0]:'')&&false){}
      return {c,crossed,j}}return null};
  const waqfBetween=(i,j)=>{for(let k=i+1;k<j;k++)if(cl[k].sep&&/[ۖ-ۜ]/.test(cl[k].t))return true;return false};
  const wordEnd=i=>{let j=i;while(j+1<cl.length&&!cl[j+1].sep)j++;return j};
  for(let i=0;i<cl.length;i++){const c=cl[i];if(c.sep)continue;const b=c.b;
    if(has(c,/\u0653/)||b==='\u0622'){out[i]='madd'}
    if((b==='ن'||b==='م')&&has(c,/ّ/)){out[i]='ghunna';continue}
    if(QAL.has(b)&&has(c,/ْ/)){out[i]='qalqala';continue}
    const tan=has(c,/[\u064B\u064C\u064D]/),noonS=b==='ن'&&!V.test(c.m)&&!has(c,/[ّ]/),meemS=b==='م'&&!V.test(c.m);
    if(tan||noonS){
      const from=tan?wordEnd(i):i,nx=nextLetter(from);if(!nx)continue;
      if(waqfBetween(from,nx.j))continue;
      const inWord=!nx.crossed&&!tan,n=nx.c.b;
      if(has(c,/ۢ/)||n==='ب'){out[i]='iqlab';continue}
      if(ikhfaL.has(n)){out[i]='ikhfa';continue}
      if(!inWord){if(idgG.has(n))out[i]='idg_g';else if(idgN.has(n))out[i]='idg_n'}
    }else if(meemS){
      const nx=nextLetter(i);if(!nx||waqfBetween(i,nx.j))continue;
      if(nx.c.b==='ب')out[i]='ikhfa';else if(nx.c.b==='م'&&nx.crossed)out[i]='idg_g'}
  }
  return cl.map((c,i)=>({t:c.t,cls:out[i]}))}
const TJ_DUAL=new Set('بتثجحخسشصضطظعغفقكلمنهيئى');
/** WebKit (iPhone/Safari) cuts Arabic letter-joining at the edge of an inline element, so every coloured letter looked detached.
 *  A zero-width joiner on BOTH sides of a styled boundary, only where the letters really connect, restores the joined forms.
 *  Display layer only: nothing stored changes, and removing the joiners gives back the original text exactly. */
function tajweedJoin(items){
  const out=items.map(x=>({t:x.t,cls:x.cls})),bs=items.map(x=>x.t[0]||''),L=/[ء-غف-يٱ]/;
  for(let i=0;i+1<out.length;i++){
    if(!out[i].cls&&!out[i+1].cls)continue;
    const a=bs[i],b=bs[i+1];
    if(!L.test(a)||!L.test(b)||!TJ_DUAL.has(a)||b==='ء')continue;
    out[i].t+='\u200D';out[i+1].t='\u200D'+out[i+1].t}
  return out}
/** Preferred path: CSS Custom Highlight API. The verse stays ONE plain text node and the colours are painted over character ranges,
 *  so the browser shapes every word exactly as it would uncoloured (no inline-element boundaries, no joiners). Fallback: spans + joiners. */
const TJ_HL=typeof CSS!=='undefined'&&CSS.highlights&&typeof Highlight!=='undefined';
if(TJ_HL){const st=document.createElement('style');st.textContent=Object.entries(TJC).map(([k,v])=>'::highlight(tj-'+k+'){color:'+v[1]+'}').join('\n');document.head.append(st)}
function tajweedReset(){if(TJ_HL)for(const k in TJC)CSS.highlights.delete('tj-'+k)}
function tajweedNodes(text){
  if(TJ_HL){
    const node=document.createTextNode(text);let off=0;
    for(const x of tajweedClassify(text)){
      if(x.cls){const r=new Range();r.setStart(node,off);r.setEnd(node,off+x.t.length);
        let h=CSS.highlights.get('tj-'+x.cls);if(!h){h=new Highlight();CSS.highlights.set('tj-'+x.cls,h)}h.add(r)}
      off+=x.t.length}
    return [node]}
  return tajweedJoin(tajweedClassify(text)).map(x=>x.cls?el('span',{class:'tj tj-'+x.cls,title:TJC[x.cls][0]},x.t):x.t)}

    const eds=(await api('GET','/translations/editions')).editions;
